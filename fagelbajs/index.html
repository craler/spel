<!doctype html>
<html lang="sv">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Fågelbajs • Spelhörnan</title>
<link rel="stylesheet" href="./style.css">
<body class="menu">
<canvas id="world" aria-label="Flygspel"></canvas><canvas id="overlay2d" aria-hidden="true"></canvas>
<div id="dread"></div><div id="flash"></div>
<div id="score" class="hud"><b id="points">0</b><small>POÄNG</small><span id="chip"></span></div>
<div id="top" class="hud"><div id="stars" aria-label="Efterlysningsnivå">☆☆☆☆☆</div>
 <div id="meter" role="progressbar" aria-label="Kaosmätare" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="meter-fill"></div></div><small id="meter-label">KAOS 0 / 100</small></div>
<div id="clock" class="hud"><b id="time">60</b><small id="time-label">SEKUNDER KVAR</small></div>
<div id="status" class="hud"><div id="feathers" aria-label="Fjädrar kvar"><i></i><i></i><i></i></div>
 <div id="reserve"><span id="tank-label">BAJS</span><div id="tank"><i id="tank-fill"></i></div></div></div>
<div class="tools"><button id="camera">Vy: bakom</button><button id="audio">Ljud på</button><button id="pause">Paus</button></div>
<div id="feedback"></div><div id="tip"></div>
<div id="touch" hidden><div id="stick"><div id="knob"></div></div><button id="t-dive">DYK</button><button id="t-fire">BAJSA</button></div>
<div id="crash-banner" hidden>wasted</div>
<div id="overlay"><section class="panel"><small class="kicker">SPELHÖRNAN / 01</small><h1 id="title">Fågelbajs</h1>
 <div id="brief"></div><div id="view" hidden></div>
 <button id="go" autofocus>Nytt spel →</button>
 <nav id="nav"><button data-view="scores">Topplista</button><button data-view="feats">Bedrifter</button><button data-view="settings">Inställningar</button><button data-view="help">Så spelar du</button></nav>
 <a href="../">Till Spelhörnan</a></section></div>
