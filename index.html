<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141b">
  <title>Kornhalls spelhörna</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 600px at 80% -10%, #2b3a63 0%, transparent 60%), #10141b; color: #f4f6fa; font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(980px, 100%); margin: auto; padding: 64px 24px 40px; }
    .label { color: #ffd24a; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(42px, 8vw, 76px); font-weight: 900; font-style: italic; line-height: .98; letter-spacing: -.035em; }
    .intro { max-width: 34em; margin: 0 0 44px; color: #c4ccd8; }
    #games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
    .card { display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; background: #1a2130; box-shadow: 0 0 0 1px #ffffff1a, 0 18px 40px #0006; color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s; }
    a.card:hover { transform: translateY(-4px); box-shadow: 0 0 0 2px #ffd24a, 0 24px 50px #0008; }
    a.card:focus-visible { outline: 3px solid #ffd24a; outline-offset: 4px; }
    .art { display: block; width: 100%; aspect-ratio: 16 / 9; }
    .art.poster { aspect-ratio: 2 / 3; object-fit: cover; object-position: top; }
    .body { padding: 20px 22px 22px; }
    h2 { margin: 0 0 6px; font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: -.02em; }
    .card p { margin: 0; color: #c4ccd8; font-size: 15.5px; }
    .play { display: inline-block; margin-top: 16px; padding: 9px 16px; border-radius: 10px; background: #ffd24a; color: #10141b; font-weight: 900; }
    .card.later { cursor: default; }
    .card.later .art { filter: saturate(.85) brightness(.8); }
    .badge { display: inline-block; margin-top: 16px; padding: 9px 16px; border-radius: 10px; background: #ffffff14; color: #ffd24a; font-weight: 900; box-shadow: inset 0 0 0 1px #ffd24a66; }
    .card { position: relative; }
    .new { position: absolute; top: 14px; right: 14px; padding: 6px 12px; border-radius: 999px; background: linear-gradient(90deg, #ff3dc8, #ff9b3d); color: #10141b; font-size: 13px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 6px 18px #0008; transform: rotate(4deg); }
    .note { display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 0; padding: 5px 10px; border-radius: 8px; background: #ffffff10; color: #f4f6fa; font-size: 13.5px; font-weight: 700; }
    .soon { display: grid; place-items: center; min-height: 220px; border: 2px dashed #ffffff26; border-radius: 20px; color: #8d97a5; text-align: center; padding: 24px; }
    footer { margin-top: 48px; color: #8d97a5; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="label">Egna idéer · egna spel</div>
    <h1>Kornhalls spelhörna</h1>
    <p class="intro">Spel vi har hittat på själva. Välj ett och kör direkt i webbläsaren – inget att installera.</p>
    <section id="games" aria-label="Alla spel"></section>
    <footer>Skapat med fantasi och hjälp av AI.</footer>
  </main>
  <script>
    // Lägg nya spel i egna mappar och lägg till dem här. "poster" är en bild till kortet, "art" en liten SVG om bild saknas.
    // "isNew: true" sätter en NYTT-etikett på kortet. "soon: true" visar kortet som Kommer snart och går inte att klicka på. Med ?test=1 i adressen går det ändå att öppna.
    const testing = new URLSearchParams(location.search).has('test');
    const games = [
      { title: 'Duv-Diarré', url: './fagelbajs/',
        description: 'Flyg en duva över staden och pricka folk, bilar och guldstjärnor. Klara dig undan frukten, näten, höken och stridsvagnarna.',
        poster: './fagelbajs/poster.jpg' },
      { title: 'Launchpad Legends', url: './launchpad/', soon: true, isNew: true,
        note: 'Kräver en Launchpad Mini MK3',
        description: 'Spelen som lever i ljuset på en Launchpad. Färgminne, rytmspel, rymdförsvar, labyrinter, portalpussel, fyra i rad och ett ljuspussel – plus en trummaskin, fyrverkerier och livets spel att leka med.',
        poster: './launchpad/poster.jpg' }
    ];
    const list = document.querySelector('#games');
    for (const game of games) {
      const locked = game.soon && !testing;
      const card = document.createElement(locked ? 'div' : 'a');
      card.className = locked ? 'card later' : 'card';
      if (!locked) card.href = game.url;
      if (game.poster) {
        const img = document.createElement('img');
        img.className = 'art poster'; img.src = game.poster; img.alt = game.title + ' – affisch'; img.loading = 'lazy';
        card.append(img);
      } else card.innerHTML = game.art;
      const body = document.createElement('div');
      body.className = 'body';
      const title = document.createElement('h2');
      title.textContent = game.title;
      const description = document.createElement('p');
      description.textContent = game.description;
      const play = document.createElement('span');
      play.className = locked ? 'badge' : 'play';
      play.textContent = locked ? 'Kommer snart' : game.soon ? 'Testa (dold) →' : 'Spela →';
      body.append(title, description);
      if (game.note) {
        const note = document.createElement('p');
        note.className = 'note';
        note.textContent = '🎛️ ' + game.note;
        body.append(note);
      }
      body.append(document.createElement('br'), play);
      if (game.isNew) {
        const badge = document.createElement('span');
        badge.className = 'new';
        badge.textContent = 'Nytt';
        card.append(badge);
      }
      card.append(body);
      list.append(card);
    }
    const soon = document.createElement('div');
    soon.className = 'soon';
    soon.textContent = 'Vi jobbar på fler spel…';
    list.append(soon);
  </script>
</body>
</html>
